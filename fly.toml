# Production — https://bandsaround.com
# Create the app once: fly apps create bandsaround
# Then: fly volumes create data --region fra --size 3 -a bandsaround

app = "bandsaround"
primary_region = "fra"

[build]

[env]
  AUTH_TRUST_HOST = "true"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "data"
  destination = "/app/data"

# fly.toml app configuration file generated for bandsaround on 2026-11-10T20:49:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bandsaround'
primary_region = 'arn'

[build]
[env]
  AUTH_TRUST_HOST = 'true'
  PORT = '3000'

[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
